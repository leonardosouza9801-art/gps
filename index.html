<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Meu Maps</title>

    <link
        href="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.css"
        rel="stylesheet"
    >

    <script src="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #fff;
        }

        #map {
            position: absolute;
            inset: 0;
        }

        /* =========================
           PAINEL SUPERIOR
        ========================= */

        .top-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            z-index: 10;
            max-width: 600px;
            margin: auto;
        }

        .search-box {
            background: white;
            border-radius: 16px;
            padding: 10px;
            box-shadow: 0 4px 18px rgba(0,0,0,.20);
        }

        .search-row {
            display: flex;
            gap: 8px;
        }

        #destination {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            padding: 12px;
            min-width: 0;
        }

        #searchBtn {
            border: none;
            background: #1a73e8;
            color: white;
            border-radius: 10px;
            padding: 0 17px;
            font-size: 15px;
            cursor: pointer;
        }

        #searchBtn:active {
            transform: scale(.97);
        }

        /* =========================
           RESULTADOS
        ========================= */

        #results {
            margin-top: 5px;
            display: none;
            max-height: 250px;
            overflow-y: auto;
        }

        .result {
            padding: 13px 10px;
            border-top: 1px solid #eee;
            cursor: pointer;
            font-size: 14px;
        }

        .result:hover {
            background: #f5f5f5;
        }

        /* =========================
           VEÍCULO
        ========================= */

        .vehicle-buttons {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .vehicle {
            flex: 1;
            border: 1px solid #ddd;
            background: white;
            border-radius: 10px;
            padding: 9px 5px;
            cursor: pointer;
            font-size: 13px;
        }

        .vehicle.active {
            background: #1a73e8;
            color: white;
            border-color: #1a73e8;
        }

        /* =========================
           INFO DA ROTA
        ========================= */

        .route-info {
            position: absolute;
            left: 15px;
            right: 15px;
            bottom: 20px;
            z-index: 10;
            max-width: 600px;
            margin: auto;

            background: white;
            border-radius: 18px;
            padding: 15px;

            box-shadow: 0 4px 18px rgba(0,0,0,.22);

            display: none;
        }

        .route-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .distance {
            font-size: 22px;
            font-weight: bold;
        }

        .time {
            font-size: 15px;
            color: #555;
        }

        .buttons {
            display: flex;
            gap: 8px;
        }

        .main-btn {
            flex: 1;
            border: none;
            border-radius: 12px;
            padding: 13px;
            font-size: 15px;
            cursor: pointer;
            background: #1a73e8;
            color: white;
        }

        .secondary-btn {
            border: none;
            border-radius: 12px;
            padding: 13px 16px;
            font-size: 15px;
            cursor: pointer;
            background: #eee;
        }

        /* =========================
           NAVEGAÇÃO
        ========================= */

        .navigation-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            z-index: 20;

            max-width: 600px;
            margin: auto;

            display: none;
        }

        .instruction {
            background: white;
            border-radius: 18px;
            padding: 15px;
            box-shadow: 0 4px 18px rgba(0,0,0,.22);
        }

        .instruction-label {
            color: #666;
            font-size: 13px;
            margin-bottom: 5px;
        }

        #instructionText {
            font-size: 20px;
            font-weight: bold;
            line-height: 1.25;
        }

        .navigation-distance {
            margin-top: 6px;
            color: #555;
            font-size: 14px;
        }

        /* =========================
           LOADING
        ========================= */

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            z-index: 100;

            background: white;
            padding: 18px 22px;
            border-radius: 14px;

            box-shadow: 0 4px 18px rgba(0,0,0,.25);

            display: none;
            text-align: center;
        }

        .loading-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .loading-text {
            font-size: 13px;
            color: #666;
        }

        /* =========================
           BOTÃO LOCALIZAÇÃO
        ========================= */

        #locationBtn {
            position: absolute;
            right: 15px;
            bottom: 180px;
            z-index: 10;

            width: 48px;
            height: 48px;

            border: none;
            border-radius: 50%;

            background: white;

            box-shadow: 0 3px 12px rgba(0,0,0,.25);

            font-size: 22px;
            cursor: pointer;
        }

        /* =========================
           STATUS
        ========================= */

        #status {
            font-size: 13px;
            color: #666;
            margin-top: 8px;
            text-align: center;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .top-panel {
                top: 10px;
                left: 10px;
                right: 10px;
            }

            .route-info {
                left: 10px;
                right: 10px;
                bottom: 10px;
            }

            #instructionText {
                font-size: 18px;
            }

            #locationBtn {
                right: 10px;
                bottom: 180px;
            }
        }
    </style>
</head>

<body>

<div id="map"></div>

<!-- =========================
     PAINEL DE PESQUISA
========================= -->

<div class="top-panel" id="searchPanel">

    <div class="search-box">

        <div class="search-row">

            <input
                id="destination"
                type="text"
                placeholder="Para onde você vai?"
                autocomplete="off"
            >

            <button id="searchBtn">
                Buscar
            </button>

        </div>

        <div id="results"></div>

        <div class="vehicle-buttons">

            <button
                class="vehicle active"
                data-profile="driving-traffic"
            >
                🚗 Carro
            </button>

            <button
                class="vehicle"
                data-profile="driving"
            >
                🏍️ Moto
            </button>

            <button
                class="vehicle"
                data-profile="cycling"
            >
                🚲 Bike
            </button>

        </div>

        <div id="status">
            Obtendo localização...
        </div>

    </div>

</div>


<!-- =========================
     INFORMAÇÕES DA ROTA
========================= -->

<div class="route-info" id="routeInfo">

    <div class="route-summary">

        <div>
            <div class="distance" id="distance">
                --
            </div>

            <div class="time" id="time">
                --
            </div>
        </div>

    </div>

    <div class="buttons">

        <button
            class="main-btn"
            id="startBtn"
        >
            ▶ Iniciar viagem
        </button>

        <button
            class="secondary-btn"
            id="recalculateBtn"
        >
            ↻
        </button>

    </div>

</div>


<!-- =========================
     NAVEGAÇÃO
========================= -->

<div
    class="navigation-panel"
    id="navigationPanel"
>

    <div class="instruction">

        <div class="instruction-label">
            Próxima instrução
        </div>

        <div id="instructionText">
            Preparando navegação...
        </div>

        <div
            class="navigation-distance"
            id="navigationDistance"
        >
            --
        </div>

        <div
            id="navigationStatus"
            style="
                margin-top:8px;
                font-size:13px;
                color:#666;
            "
        >
            GPS ativo
        </div>

        <button
            id="stopBtn"
            style="
                margin-top:12px;
                width:100%;
                padding:11px;
                border:none;
                border-radius:10px;
                background:#eee;
                cursor:pointer;
            "
        >
            Encerrar viagem
        </button>

    </div>

</div>


<!-- =========================
     LOADING
========================= -->

<div
    class="loading"
    id="loading"
>
    <div class="loading-title">
        Calculando rota
    </div>

    <div
        class="loading-text"
        id="loadingText"
    >
        Aguarde...
    </div>
</div>


<!-- =========================
     LOCALIZAÇÃO
========================= -->

<button id="locationBtn">
    📍
</button>


<script>

    /* =====================================================
       CONFIGURAÇÃO MAPBOX
    ===================================================== */

    mapboxgl.accessToken =
        'pk.eyJ1IjoibGVvbmFyZG9zb3V6YXMiLCJhIjoiY21gODQ4OG0wMDRuMDJycGw1N3ByeGNpbiJ9.yj4IXhTZD-oU1to8PzPsgA';


    /* =====================================================
       VARIÁVEIS
    ===================================================== */

    let map;

    let userLocation = null;

    let destinationLocation = null;

    let destinationName = '';

    let currentRoute = null;

    let currentSteps = [];

    let selectedProfile = 'driving-traffic';

    let navigationActive = false;

    let watchId = null;

    let userMarker = null;

    let destinationMarker = null;

    let currentStepIndex = 0;


    /* =====================================================
       CRIAR MAPA
    ===================================================== */

    map = new mapboxgl.Map({

        container: 'map',

        style: 'mapbox://styles/mapbox/streets-v12',

        center: [-49.0, -16.0],

        zoom: 5

    });


    map.addControl(
        new mapboxgl.NavigationControl(),
        'bottom-left'
    );


    /* =====================================================
       ELEMENTOS
    ===================================================== */

    const destinationInput =
        document.getElementById('destination');

    const searchBtn =
        document.getElementById('searchBtn');

    const results =
        document.getElementById('results');

    const routeInfo =
        document.getElementById('routeInfo');

    const loading =
        document.getElementById('loading');

    const loadingText =
        document.getElementById('loadingText');

    const status =
        document.getElementById('status');

    const distanceElement =
        document.getElementById('distance');

    const timeElement =
        document.getElementById('time');

    const startBtn =
        document.getElementById('startBtn');

    const stopBtn =
        document.getElementById('stopBtn');

    const recalculateBtn =
        document.getElementById('recalculateBtn');

    const locationBtn =
        document.getElementById('locationBtn');

    const navigationPanel =
        document.getElementById('navigationPanel');

    const instructionText =
        document.getElementById('instructionText');

    const navigationDistance =
        document.getElementById('navigationDistance');

    const navigationStatus =
        document.getElementById('navigationStatus');


    /* =====================================================
       QUANDO MAPA CARREGAR
    ===================================================== */

    map.on('load', () => {

        getUserLocation();

    });


    /* =====================================================
       OBTER LOCALIZAÇÃO
    ===================================================== */

    function getUserLocation() {

        status.textContent =
            'Obtendo sua localização...';

        if (!navigator.geolocation) {

            status.textContent =
                'Seu navegador não suporta GPS.';

            return;
        }

        navigator.geolocation.getCurrentPosition(

            position => {

                const lat =
                    position.coords.latitude;

                const lng =
                    position.coords.longitude;

                userLocation = [lng, lat];

                showUserLocation();

                map.flyTo({

                    center: userLocation,

                    zoom: 15,

                    duration: 1200

                });

                status.textContent =
                    'Localização encontrada ✓';

            },

            error => {

                console.error(
                    'Erro GPS:',
                    error
                );

                status.textContent =
                    'Não foi possível obter o GPS.';

                alert(
                    'Não foi possível obter sua localização.\n\n' +
                    'Verifique se o navegador permitiu o acesso à localização.'
                );

            },

            {

                enableHighAccuracy: true,

                timeout: 15000,

                maximumAge: 10000

            }

        );

    }


    /* =====================================================
       MOSTRAR USUÁRIO
    ===================================================== */

    function showUserLocation() {

        if (!userLocation) return;

        if (userMarker) {

            userMarker.setLngLat(
                userLocation
            );

            return;
        }

        const element =
            document.createElement('div');

        element.style.width = '18px';

        element.style.height = '18px';

        element.style.borderRadius = '50%';

        element.style.background = '#1a73e8';

        element.style.border = '4px solid white';

        element.style.boxShadow =
            '0 0 0 2px rgba(0,0,0,.15)';

        userMarker =
            new mapboxgl.Marker(element)
                .setLngLat(userLocation)
                .addTo(map);

    }


    /* =====================================================
       BUSCA DE ENDEREÇO
    ===================================================== */

    searchBtn.addEventListener(
        'click',
        searchDestination
    );


    destinationInput.addEventListener(
        'keydown',
        event => {

            if (event.key === 'Enter') {

                searchDestination();

            }

        }
    );


    async function searchDestination() {

        const query =
            destinationInput.value.trim();

        if (!query) {

            alert(
                'Digite um endereço ou local.'
            );

            return;
        }

        results.style.display =
            'none';

        showLoading(
            'Pesquisando endereço...'
        );

        try {

            const url =
                'https://api.mapbox.com/search/geocode/v6/forward?' +
                'q=' + encodeURIComponent(query) +
                '&language=pt-BR' +
                '&limit=5' +
                '&access_token=' +
                mapboxgl.accessToken;

            const response =
                await fetch(url);

            if (!response.ok) {

                throw new Error(
                    'Erro HTTP ' +
                    response.status
                );

            }

            const data =
                await response.json();

            hideLoading();

            if (
                !data.features ||
                data.features.length === 0
            ) {

                alert(
                    'Nenhum endereço encontrado.'
                );

                return;
            }

            showResults(
                data.features
            );

        } catch (error) {

            hideLoading();

            console.error(error);

            alert(
                'Erro ao pesquisar o endereço.'
            );

        }

    }


    /* =====================================================
       MOSTRAR RESULTADOS
    ===================================================== */

    function showResults(features) {

        results.innerHTML = '';

        features.forEach(feature => {

            const item =
                document.createElement('div');

            item.className =
                'result';

            const name =
                feature.properties?.full_address ||
                feature.properties?.name ||
                feature.place_name ||
                'Local';

            item.textContent =
                name;

            item.addEventListener(
                'click',
                () => {

                    selectDestination(
                        feature
                    );

                }
            );

            results.appendChild(item);

        });

        results.style.display =
            'block';

    }


    /* =====================================================
       SELECIONAR DESTINO
    ===================================================== */

    async function selectDestination(feature) {

        results.style.display =
            'none';

        const coordinates =
            feature.geometry.coordinates;

        destinationLocation =
            [
                coordinates[0],
                coordinates[1]
            ];

        destinationName =
            feature.properties?.full_address ||
            feature.properties?.name ||
            feature.place_name ||
            'Destino';

        destinationInput.value =
            destinationName;

        if (destinationMarker) {

            destinationMarker.remove();

        }

        destinationMarker =
            new mapboxgl.Marker({
                color: '#e53935'
            })
            .setLngLat(destinationLocation)
            .addTo(map);

        map.flyTo({

            center: destinationLocation,

            zoom: 14,

            duration: 1000

        });

        await calculateRoute();

    }


    /* =====================================================
       SELEÇÃO DE VEÍCULO
    ===================================================== */

    document
        .querySelectorAll('.vehicle')
        .forEach(button => {

            button.addEventListener(
                'click',
                () => {

                    document
                        .querySelectorAll('.vehicle')
                        .forEach(btn => {

                            btn.classList.remove(
                                'active'
                            );

                        });

                    button.classList.add(
                        'active'
                    );

                    selectedProfile =
                        button.dataset.profile;

                    /*
                     * Se já existe destino,
                     * recalcula a rota.
                     */

                    if (
                        userLocation &&
                        destinationLocation
                    ) {

                        calculateRoute();

                    }

                }
            );

        });


    /* =====================================================
       CALCULAR ROTA
    ===================================================== */

    async function calculateRoute() {

        if (!userLocation) {

            hideLoading();

            alert(
                'Ainda não conseguimos obter sua localização. ' +
                'Ative o GPS e tente novamente.'
            );

            getUserLocation();

            return;

        }

        if (!destinationLocation) {

            return;

        }

        showLoading(
            'Calculando rota...'
        );

        routeInfo.style.display =
            'none';

        try {

            const origin =
                userLocation.join(',');

            const destination =
                destinationLocation.join(',');

            const url =
                'https://api.mapbox.com/directions/v5/mapbox/' +
                selectedProfile +
                '/' +
                origin +
                ';' +
                destination +
                '?' +
                'alternatives=false' +
                '&geometries=geojson' +
                '&overview=full' +
                '&steps=true' +
                '&language=pt-BR' +
                '&access_token=' +
                mapboxgl.accessToken;


            console.log(
                'Calculando:',
                url
            );


            const response =
                await fetch(url);


            if (!response.ok) {

                const text =
                    await response.text();

                console.error(
                    'Mapbox respondeu:',
                    text
                );

                throw new Error(
                    'Erro HTTP ' +
                    response.status
                );

            }


            const data =
                await response.json();


            if (
                !data.routes ||
                data.routes.length === 0
            ) {

                throw new Error(
                    'Nenhuma rota encontrada.'
                );

            }


            currentRoute =
                data.routes[0];


            /*
             * Guardamos as instruções.
             */

            currentSteps =
                currentRoute.legs?.[0]?.steps || [];


            /*
             * Desenha a rota.
             */

            drawRoute(
                currentRoute.geometry
            );


            /*
             * Mostra distância.
             */

            distanceElement.textContent =
                formatDistance(
                    currentRoute.distance
                );


            /*
             * Mostra duração.
             */

            timeElement.textContent =
                formatDuration(
                    currentRoute.duration
                );


            routeInfo.style.display =
                'block';


            hideLoading();


            status.textContent =
                'Rota pronta ✓';


            /*
             * Ajusta o mapa para mostrar
             * toda a rota.
             */

            fitRoute(
                currentRoute.geometry
            );


        } catch (error) {

            hideLoading();

            console.error(
                'Erro ao calcular rota:',
                error
            );

            alert(
                'Não foi possível calcular a rota.\n\n' +
                error.message
            );

            status.textContent =
                'Erro ao calcular rota.';

        }

    }


    /* =====================================================
       DESENHAR ROTA
    ===================================================== */

    function drawRoute(geometry) {

        if (
            map.getSource('route')
        ) {

            map.getSource('route')
                .setData({

                    type: 'Feature',

                    geometry: geometry

                });

            return;

        }


        map.addSource(
            'route',
            {

                type: 'geojson',

                data: {

                    type: 'Feature',

                    geometry: geometry

                }

            }
        );


        map.addLayer({

            id: 'route',

            type: 'line',

            source: 'route',

            layout: {

                'line-join': 'round',

                'line-cap': 'round'

            },

            paint: {

                'line-color': '#1a73e8',

                'line-width': 7,

                'line-opacity': 0.9

            }

        });

    }


    /* =====================================================
       ENQUADRAR ROTA
    ===================================================== */

    function fitRoute(geometry) {

        const coordinates =
            geometry.coordinates;

        if (!coordinates.length) return;

        const bounds =
            new mapboxgl.LngLatBounds(
                coordinates[0],
                coordinates[0]
            );

        coordinates.forEach(
            coordinate => {

                bounds.extend(
                    coordinate
                );

            }
        );

        map.fitBounds(
            bounds,
            {

                padding: 80,

                duration: 1000

            }
        );

    }


    /* =====================================================
       INICIAR VIAGEM
    ===================================================== */

    startBtn.addEventListener(
        'click',
        startNavigation
    );


    function startNavigation() {

        if (!currentRoute) {

            alert(
                'Primeiro calcule uma rota.'
            );

            return;

        }


        if (!navigator.geolocation) {

            alert(
                'Seu navegador não suporta GPS.'
            );

            return;

        }


        navigationActive = true;

        currentStepIndex = 0;


        /*
         * Esconde pesquisa e resumo.
         */

        document.getElementById(
            'searchPanel'
        ).style.display = 'none';

        routeInfo.style.display =
            'none';


        /*
         * Mostra painel de navegação.
         */

        navigationPanel.style.display =
            'block';


        /*
         * Mostra primeira instrução.
         */

        updateInstruction();


        /*
         * Começa acompanhamento GPS.
         */

        watchId =
            navigator.geolocation.watchPosition(

                position => {

                    const lat =
                        position.coords.latitude;

                    const lng =
                        position.coords.longitude;

                    userLocation =
                        [lng, lat];


                    showUserLocation();


                    /*
                     * Move mapa.
                     */

                    map.easeTo({

                        center:
                            userLocation,

                        zoom: 17,

                        duration: 500

                    });


                    /*
                     * Atualiza instruções.
                     */

                    updateNavigationProgress();


                    navigationStatus.textContent =
                        'GPS ativo • ' +
                        Math.round(
                            position.coords.accuracy
                        ) +
                        ' m de precisão';

                },


                error => {

                    console.error(
                        'GPS:',
                        error
                    );

                    navigationStatus.textContent =
                        'Problema com o GPS';

                },

                {

                    enableHighAccuracy: true,

                    maximumAge: 2000,

                    timeout: 10000

                }

            );


        /*
         * Fala a primeira instrução.
         */

        setTimeout(
            () => {

                speakCurrentInstruction();

            },
            500
        );

    }


    /* =====================================================
       ATUALIZAR PROGRESSO
    ===================================================== */

    function updateNavigationProgress() {

        if (
            !navigationActive ||
            !userLocation ||
            !currentRoute
        ) {

            return;

        }


        /*
         * Verifica distância até o destino.
         */

        const distanceToDestination =
            distanceBetween(
                userLocation,
                destinationLocation
            );


        if (
            distanceToDestination < 30
        ) {

            finishNavigation();

            return;

        }


        /*
         * Avança as instruções
         * conforme o usuário se aproxima
         * dos pontos da rota.
         */

        if (
            currentSteps.length === 0
        ) {

            return;

        }


        const step =
            currentSteps[currentStepIndex];


        if (!step) return;


        const maneuverLocation =
            step.maneuver?.location;


        if (!maneuverLocation) return;


        const distanceToManeuver =
            distanceBetween(
                userLocation,
                maneuverLocation
            );


        navigationDistance.textContent =
            formatDistance(
                distanceToManeuver
            );


        /*
         * Quando estiver próximo
         * da manobra, passa para
         * a próxima.
         */

        if (
            distanceToManeuver < 35 &&
            currentStepIndex <
                currentSteps.length - 1
        ) {

            currentStepIndex++;

            updateInstruction();

            speakCurrentInstruction();

        }

    }


    /* =====================================================
       MOSTRAR INSTRUÇÃO
    ===================================================== */

    function updateInstruction() {

        const step =
            currentSteps[currentStepIndex];


        if (!step) {

            instructionText.textContent =
                'Siga até o destino';

            return;

        }


        const instruction =
            step.maneuver?.instruction ||
            'Continue pela rota';


        instructionText.textContent =
            instruction;


        if (
            step.distance !== undefined
        ) {

            navigationDistance.textContent =
                formatDistance(
                    step.distance
                );

        }

    }


    /* =====================================================
       VOZ
    ===================================================== */

    function speakCurrentInstruction() {

        if (
            !('speechSynthesis' in window)
        ) {

            return;

        }


        const step =
            currentSteps[currentStepIndex];


        if (!step) return;


        const text =
            step.maneuver?.instruction;


        if (!text) return;


        window.speechSynthesis.cancel();


        const speech =
            new SpeechSynthesisUtterance(
                text
            );


        speech.lang =
            'pt-BR';


        speech.rate =
            1;


        window.speechSynthesis.speak(
            speech
        );

    }


    /* =====================================================
       ENCERRAR VIAGEM
    ===================================================== */

    stopBtn.addEventListener(
        'click',
        stopNavigation
    );


    function stopNavigation() {

        navigationActive =
            false;


        if (
            watchId !== null
        ) {

            navigator.geolocation
                .clearWatch(
                    watchId
                );

            watchId = null;

        }


        if (
            'speechSynthesis' in window
        ) {

            window.speechSynthesis.cancel();

        }


        navigationPanel.style.display =
            'none';


        document.getElementById(
            'searchPanel'
        ).style.display =
            'block';


        routeInfo.style.display =
            'block';


        status.textContent =
            'Viagem encerrada.';

    }


    /* =====================================================
       FINALIZAR VIAGEM
    ===================================================== */

    function finishNavigation() {

        navigationActive =
            false;


        if (
            watchId !== null
        ) {

            navigator.geolocation
                .clearWatch(
                    watchId
                );

            watchId = null;

        }


        navigationPanel.style.display =
            'none';


        document.getElementById(
            'searchPanel'
        ).style.display =
            'block';


        alert(
            'Você chegou ao destino! 🏁'
        );


        status.textContent =
            'Você chegou ao destino ✓';

    }


    /* =====================================================
       RECALCULAR
    ===================================================== */

    recalculateBtn.addEventListener(
        'click',
        () => {

            if (
                userLocation &&
                destinationLocation
            ) {

                calculateRoute();

            }

        }
    );


    /* =====================================================
       BOTÃO LOCALIZAÇÃO
    ===================================================== */

    locationBtn.addEventListener(
        'click',
        () => {

            if (!userLocation) {

                getUserLocation();

                return;

            }


            map.flyTo({

                center:
                    userLocation,

                zoom: 17,

                duration: 800

            });

        }
    );


    /* =====================================================
       DISTÂNCIA ENTRE DOIS PONTOS
    ===================================================== */

    function distanceBetween(
        point1,
        point2
    ) {

        const R =
            6371000;


        const lat1 =
            point1[1] *
            Math.PI / 180;


        const lat2 =
            point2[1] *
            Math.PI / 180;


        const deltaLat =
            (point2[1] - point1[1]) *
            Math.PI / 180;


        const deltaLng =
            (point2[0] - point1[0]) *
            Math.PI / 180;


        const a =
            Math.sin(deltaLat / 2) *
            Math.sin(deltaLat / 2) +

            Math.cos(lat1) *
            Math.cos(lat2) *

            Math.sin(deltaLng / 2) *
            Math.sin(deltaLng / 2);


        const c =
            2 *
            Math.atan2(
                Math.sqrt(a),
                Math.sqrt(1 - a)
            );


        return R * c;

    }


    /* =====================================================
       FORMATAR DISTÂNCIA
    ===================================================== */

    function formatDistance(
        meters
    ) {

        if (
            meters < 1000
        ) {

            return (
                Math.round(meters) +
                ' m'
            );

        }


        return (
            (meters / 1000)
                .toFixed(1)
                .replace('.', ',') +
            ' km'
        );

    }


    /* =====================================================
       FORMATAR TEMPO
    ===================================================== */

    function formatDuration(
        seconds
    ) {

        const minutes =
            Math.round(
                seconds / 60
            );


        if (
            minutes < 60
        ) {

            return (
                minutes +
                ' min'
            );

        }


        const hours =
            Math.floor(
                minutes / 60
            );


        const remaining =
            minutes % 60;


        if (
            remaining === 0
        ) {

            return (
                hours +
                ' h'
            );

        }


        return (
            hours +
            ' h ' +
            remaining +
            ' min'
        );

    }


    /* =====================================================
       LOADING
    ===================================================== */

    function showLoading(
        text
    ) {

        loadingText.textContent =
            text;

        loading.style.display =
            'block';

    }


    function hideLoading() {

        loading.style.display =
            'none';

    }


    /* =====================================================
       CLIQUE FORA DOS RESULTADOS
    ===================================================== */

    document.addEventListener(
        'click',
        event => {

            if (
                !event.target.closest(
                    '.search-box'
                )
            ) {

                results.style.display =
                    'none';

            }

        }
    );

</script>
