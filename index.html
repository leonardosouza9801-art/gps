<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Meu GPS</title>

  <link
    href="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.css"
    rel="stylesheet"
  />

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #status {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;

      background: white;
      padding: 12px 18px;
      border-radius: 12px;

      box-shadow: 0 3px 15px rgba(0,0,0,.2);

      font-size: 15px;
      font-weight: bold;

      max-width: 90%;
      text-align: center;
    }

    #info {
      position: fixed;
      bottom: 20px;
      left: 15px;
      right: 15px;

      z-index: 10;

      background: white;
      border-radius: 15px;
      padding: 15px;

      box-shadow: 0 3px 15px rgba(0,0,0,.2);

      display: none;
    }

    #info div {
      margin: 5px 0;
    }

    .mapboxgl-ctrl-geolocate {
      width: 44px !important;
      height: 44px !important;
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <div id="status">
    Iniciando GPS...
  </div>

  <div id="info">
    <div><strong>GPS ativo</strong></div>
    <div id="lat">Latitude: --</div>
    <div id="lng">Longitude: --</div>
    <div id="accuracy">Precisão: --</div>
  </div>

  <script>

    // =====================================================
    // MAPBOX
    // =====================================================

    mapboxgl.accessToken =
      'pk.eyJ1IjoibGVvbmFyZG9zb3V6YXMiLCJhIjoiY21gODQ0OG0wMDRuMDJycGw1N3ByeGNpbiJ9.yj4IXhTZD-oU1to8PzPsgA';


    // =====================================================
    // VERIFICAR SUPORTE
    // =====================================================

    if (!mapboxgl.supported()) {

      document.getElementById('status').textContent =
        'Seu navegador não suporta o mapa.';

    } else {

      // ===================================================
      // CRIAR MAPA
      // ===================================================

      const map = new mapboxgl.Map({

        container: 'map',

        style: 'mapbox://styles/mapbox/standard',

        center: [-49.8, -15.8],

        zoom: 5

      });


      // ===================================================
      // CONTROLES DE ZOOM
      // ===================================================

      map.addControl(
        new mapboxgl.NavigationControl(),
        'top-right'
      );


      // ===================================================
      // GPS
      // ===================================================

      const geolocate = new mapboxgl.GeolocateControl({

        positionOptions: {

          enableHighAccuracy: true,

          timeout: 15000,

          maximumAge: 0

        },

        trackUserLocation: true,

        showUserLocation: true,

        showUserHeading: true,

        showAccuracyCircle: true,

        fitBoundsOptions: {

          maxZoom: 17

        }

      });


      map.addControl(
        geolocate,
        'top-right'
      );


      // ===================================================
      // MAPA CARREGADO
      // ===================================================

      map.on('load', function () {

        document.getElementById('status').textContent =
          'Mapa carregado — toque no botão GPS';

      });


      // ===================================================
      // GPS ENCONTRADO
      // ===================================================

      geolocate.on('geolocate', function (event) {

        const latitude =
          event.coords.latitude;

        const longitude =
          event.coords.longitude;

        const accuracy =
          event.coords.accuracy;


        document.getElementById('status').textContent =
          'GPS funcionando';


        document.getElementById('info').style.display =
          'block';


        document.getElementById('lat').textContent =
          'Latitude: ' + latitude.toFixed(6);


        document.getElementById('lng').textContent =
          'Longitude: ' + longitude.toFixed(6);


        document.getElementById('accuracy').textContent =
          'Precisão: ' + Math.round(accuracy) + ' metros';

      });


      // ===================================================
      // ERRO GPS
      // ===================================================

      geolocate.on('error', function (event) {

        console.error('Erro GPS:', event);

        document.getElementById('status').textContent =
          'Não foi possível acessar o GPS';

      });


      // ===================================================
      // INICIANDO GPS
      // ===================================================

      geolocate.on('trackuserlocationstart', function () {

        document.getElementById('status').textContent =
          'Procurando sua localização...';

      });


      // ===================================================
      // GPS PARADO
      // ===================================================

      geolocate.on('trackuserlocationend', function () {

        document.getElementById('status').textContent =
          'GPS parado';

      });

    }

  </script>

</body>
</html>
