<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Meu GPS</title>

  <link href="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #map {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* BUSCA */
    #search {
      position: fixed;
      top: 15px;
      left: 15px;
      right: 15px;
      z-index: 100;
    }

    #searchInput {
      width: 100%;
      height: 52px;
      border: 0;
      outline: none;
      border-radius: 14px;
      padding: 0 18px;
      font-size: 16px;
      background: #fff;
      box-shadow: 0 3px 15px rgba(0,0,0,.25);
    }

    #results {
      margin-top: 6px;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 15px rgba(0,0,0,.2);
    }

    .result {
      padding: 14px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      font-size: 15px;
    }

    .result:last-child {
      border-bottom: 0;
    }

    /* PAINEL DE CONTROLE DE ROTA */
    #routePanel {
      position: fixed;
      top: 75px;
      left: 15px;
      right: 15px;
      z-index: 100;
      background: white;
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,.25);
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    .mode-selector {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .mode-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #f8f9fa;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.2s;
    }

    .mode-btn.active {
      background: #007bff;
      color: white;
      border-color: #007bff;
    }

    #startRouteBtn {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: #28a745;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    /* STATUS */
    #status {
      position: fixed;
      left: 15px;
      right: 15px;
      bottom: 15px;
      z-index: 100;
      padding: 13px;
      background: white;
      border-radius: 14px;
      text-align: center;
      font-weight: bold;
      box-shadow: 0 3px 15px rgba(0,0,0,.2);
    }

    /* GPS */
    #gps {
      position: fixed;
      right: 15px;
      bottom: 75px;
      z-index: 100;
      width: 54px;
      height: 54px;
      border: 0;
      border-radius: 50%;
      background: white;
      box-shadow: 0 3px 15px rgba(0,0,0,.25);
      font-size: 25px;
      cursor: pointer;
    }

    #gpsInfo {
      position: fixed;
      left: 15px;
      right: 15px;
      bottom: 70px;
      z-index: 99;
      display: none;
      padding: 10px;
      background: white;
      border-radius: 12px;
      font-size: 13px;
      box-shadow: 0 3px 15px rgba(0,0,0,.2);
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <div id="search">
    <input
      id="searchInput"
      type="search"
      placeholder="🔍 Para onde você quer ir?"
      autocomplete="off"
    >
    <div id="results"></div>
  </div>

  <div id="routePanel">
    <div class="mode-selector">
      <button class="mode-btn active" data-mode="driving">🚗 Carro</button>
      <button class="mode-btn" data-mode="driving-traffic">🏍️ Moto</button>
      <button class="mode-btn" data-mode="cycling">🚲 Bike</button>
    </div>
    <button id="startRouteBtn">▶️ Iniciar Rota</button>
  </div>

  <button id="gps">📍</button>

  <div id="gpsInfo">GPS: procurando...</div>

  <div id="status">Carregando mapa...</div>

<script>
  const MAPBOX_TOKEN = 'pk.eyJ1IjoibGVvbmFyZG9zb3V6YXMiLCJhIjoiY210djA2dHcyMDNkZTJ4cTZqbHhuMHd0NSJ9.ZT5j5MRsPHpjOv3nihjYGw';

  mapboxgl.accessToken = MAPBOX_TOKEN;

  function setStatus(text) {
    document.getElementById('status').textContent = text;
  }

  let map;
  let userCoords = null;
  let destinationCoords = null;
  let selectedMode = 'driving';

  try {
    map = new mapboxgl.Map({
      container: 'map',
      accessToken: MAPBOX_TOKEN,
      style: 'mapbox://styles/mapbox/streets-v12',
      center: [-49.8, -15.8],
      zoom: 5
    });
  } catch (error) {
    console.error(error);
    setStatus('Erro ao iniciar o Mapbox');
  }

  map.on('load', function() {
    setStatus('Mapa funcionando — ative o GPS');

    // Camada para desenhar a linha da rota
    map.addSource('route', {
      type: 'geojson',
      data: {
        type: 'Feature',
        properties: {},
        geometry: { type: 'LineString', coordinates: [] }
      }
    });

    map.addLayer({
      id: 'route',
      type: 'line',
      source: 'route',
      layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: { 'line-color': '#007bff', 'line-width': 6 }
    });
  });

  map.on('error', function(event) {
    console.error('ERRO MAPBOX:', event);
    if (event.error && event.error.message) {
      setStatus('Erro Mapbox: ' + event.error.message);
    } else {
      setStatus('Erro ao carregar o mapa');
    }
  });

  map.addControl(new mapboxgl.NavigationControl(), 'top-right');

  // CONTROLE DE GPS
  const geolocate = new mapboxgl.GeolocateControl({
    positionOptions: { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 },
    trackUserLocation: true,
    showUserLocation: true,
    showUserHeading: true,
    showAccuracyCircle: true
  });

  map.addControl(geolocate, 'top-right');

  geolocate.on('geolocate', function(event) {
    userCoords = [event.coords.longitude, event.coords.latitude];

    document.getElementById('gpsInfo').style.display = 'block';
    document.getElementById('gpsInfo').textContent =
      '📍 Lat: ' + userCoords[1].toFixed(6) +
      ' | Lng: ' + userCoords[0].toFixed(6) +
      ' | Precisão: ' + Math.round(event.coords.accuracy) + ' m';

    setStatus('GPS funcionando');
  });

  geolocate.on('trackuserlocationstart', function() {
    setStatus('Procurando sua localização...');
  });

  geolocate.on('error', function(event) {
    console.error('ERRO GPS:', event);
    setStatus('Permita o acesso à localização');
  });

  document.getElementById('gps').addEventListener('click', function() {
    geolocate.trigger();
  });

  // BUSCA
  const searchInput = document.getElementById('searchInput');
  const results = document.getElementById('results');
  let searchTimeout;

  searchInput.addEventListener('input', function() {
    const query = searchInput.value.trim();
    clearTimeout(searchTimeout);

    if (query.length < 3) {
      results.innerHTML = '';
      return;
    }

    searchTimeout = setTimeout(function() {
      search(query);
    }, 400);
  });

  async function search(query) {
    results.innerHTML = '<div class="result">Pesquisando...</div>';

    try {
      const url = 'https://api.mapbox.com/search/geocode/v6/forward' +
        '?q=' + encodeURIComponent(query) +
        '&limit=5&language=pt-BR&country=BR&access_token=' + encodeURIComponent(MAPBOX_TOKEN);

      const response = await fetch(url);
      const data = await response.json();

      if (!response.ok) {
        results.innerHTML = '<div class="result">Erro na busca.</div>';
        return;
      }

      results.innerHTML = '';

      if (!data.features || data.features.length === 0) {
        results.innerHTML = '<div class="result">Nenhum local encontrado.</div>';
        return;
      }

      data.features.forEach(function(feature) {
        const item = document.createElement('div');
        item.className = 'result';
        item.textContent = feature.properties.full_address || feature.properties.name || 'Local';
        item.onclick = function() { selectPlace(feature); };
        results.appendChild(item);
      });
    } catch (error) {
      console.error('ERRO BUSCA:', error);
      results.innerHTML = '<div class="result">Erro de conexão.</div>';
    }
  }

  let destinationMarker = null;

  function selectPlace(feature) {
    destinationCoords = feature.geometry.coordinates;

    if (destinationMarker) {
      destinationMarker.remove();
    }

    destinationMarker = new mapboxgl.Marker({ color: '#e53935' })
      .setLngLat(destinationCoords)
      .addTo(map);

    map.flyTo({ center: destinationCoords, zoom: 15, duration: 1000 });

    searchInput.value = feature.properties.name || feature.properties.full_address || 'Destino';
    results.innerHTML = '';

    // Exibe o painel de rotas
    document.getElementById('routePanel').style.display = 'flex';
    setStatus('Destino selecionado. Escolha o transporte.');
  }

  // SELEÇÃO DE MODO DE TRANSPORTE
  const modeButtons = document.querySelectorAll('.mode-btn');
  modeButtons.forEach(button => {
    button.addEventListener('click', function() {
      modeButtons.forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      selectedMode = this.getAttribute('data-mode');
    });
  });

  // BOTÃO INICIAR ROTA
  document.getElementById('startRouteBtn').addEventListener('click', function() {
    if (!userCoords) {
      setStatus('Ative seu GPS primeiro para iniciar a rota!');
      geolocate.trigger();
      return;
    }
    if (!destinationCoords) {
      setStatus('Selecione um destino primeiro!');
      return;
    }

    calculateRoute(userCoords, destinationCoords, selectedMode);
  });

  // CALCULAR ROTA VIA MAPBOX DIRECTIONS API
  async function calculateRoute(start, end, mode) {
    setStatus('Calculando rota...');

    try {
      const url = `https://api.mapbox.com/directions/v5/mapbox/${mode}/${start[0]},${start[1]};${end[0]},${end[1]}?geometries=geojson&overview=full&language=pt-BR&access_token=${MAPBOX_TOKEN}`;

      const response = await fetch(url);
      const data = await response.json();

      if (!response.ok || !data.routes || data.routes.length === 0) {
        setStatus('Não foi possível calcular a rota.');
        return;
      }

      const route = data.routes[0];
      const duration = Math.round(route.duration / 60); // minutos
      const distance = (route.distance / 1000).toFixed(1); // km

      // Desenha a linha da rota no mapa
      map.getSource('route').setData({
        type: 'Feature',
        properties: {},
        geometry: route.geometry
      });

      // Ajusta o zoom do mapa para mostrar a rota completa
      const bounds = new mapboxgl.LngLatBounds();
      route.geometry.coordinates.forEach(coord => bounds.extend(coord));
      map.fitBounds(bounds, { padding: 80 });

      setStatus(`Rota iniciada! ⏱️ ${duration} min (${distance} km)`);
    } catch (error) {
      console.error('ERRO ROTA:', error);
      setStatus('Erro ao conectar com serviço de rotas.');
    }
  }

  // FECHAR PESQUISA
  document.addEventListener('click', function(event) {
    const searchBox = document.getElementById('search');
    if (!searchBox.contains(event.target)) {
      results.innerHTML = '';
    }
  });
</script>

</body>
</html>
