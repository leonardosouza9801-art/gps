<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Meu GPS</title>

  <link
    href="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.css"
    rel="stylesheet"
  >

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #map {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* BUSCA */

    #search {
      position: fixed;
      top: 15px;
      left: 15px;
      right: 15px;
      z-index: 100;
    }

    #searchInput {
      width: 100%;
      height: 52px;

      border: 0;
      outline: none;
      border-radius: 14px;

      padding: 0 18px;

      font-size: 16px;

      background: #fff;

      box-shadow: 0 3px 15px rgba(0,0,0,.25);
    }

    #results {
      margin-top: 6px;

      background: #fff;
      border-radius: 12px;

      overflow: hidden;

      box-shadow: 0 3px 15px rgba(0,0,0,.2);
    }

    .result {
      padding: 14px;

      border-bottom: 1px solid #eee;

      cursor: pointer;

      font-size: 15px;
    }

    .result:last-child {
      border-bottom: 0;
    }

    /* STATUS */

    #status {
      position: fixed;

      left: 15px;
      right: 15px;
      bottom: 15px;

      z-index: 100;

      padding: 13px;

      background: white;

      border-radius: 14px;

      text-align: center;

      font-weight: bold;

      box-shadow: 0 3px 15px rgba(0,0,0,.2);
    }

    /* GPS */

    #gps {
      position: fixed;

      right: 15px;
      bottom: 75px;

      z-index: 100;

      width: 54px;
      height: 54px;

      border: 0;
      border-radius: 50%;

      background: white;

      box-shadow: 0 3px 15px rgba(0,0,0,.25);

      font-size: 25px;

      cursor: pointer;
    }

    #gpsInfo {
      position: fixed;

      left: 15px;
      right: 15px;
      bottom: 70px;

      z-index: 99;

      display: none;

      padding: 10px;

      background: white;

      border-radius: 12px;

      font-size: 13px;

      box-shadow: 0 3px 15px rgba(0,0,0,.2);
    }

  </style>
</head>

<body>

  <div id="map"></div>

  <div id="search">

    <input
      id="searchInput"
      type="search"
      placeholder="🔍 Para onde você quer ir?"
      autocomplete="off"
    >

    <div id="results"></div>

  </div>

  <button id="gps">
    📍
  </button>

  <div id="gpsInfo">
    GPS: procurando...
  </div>

  <div id="status">
    Carregando mapa...
  </div>


<script>

  // =====================================================
  // SEU NOVO TOKEN MAPBOX
  // =====================================================

  const MAPBOX_TOKEN =
    'pk.eyJ1IjoibGVvbmFyZG9zb3V6YXMiLCJhIjoiY210djAxMWk3MG52bTJyNXN2aTQ2cmJtbyJ9.daGno2JnVvuZyFBOWR9AaQ';


  // =====================================================
  // CONFIGURAÇÃO MAPBOX
  // =====================================================

  mapboxgl.accessToken = MAPBOX_TOKEN;


  // =====================================================
  // STATUS
  // =====================================================

  function setStatus(text) {

    document.getElementById('status').textContent = text;

  }


  // =====================================================
  // CRIAR MAPA
  // =====================================================

  let map;

  try {

    map = new mapboxgl.Map({

      container: 'map',

      accessToken: MAPBOX_TOKEN,

      style: 'mapbox://styles/mapbox/streets-v12',

      center: [-49.8, -15.8],

      zoom: 5

    });

  } catch (error) {

    console.error(error);

    setStatus('Erro ao iniciar o Mapbox');

  }


  // =====================================================
  // MAPA PRONTO
  // =====================================================

  map.on('load', function() {

    setStatus('Mapa funcionando — ative o GPS');

  });


  // =====================================================
  // ERRO MAPBOX
  // =====================================================

  map.on('error', function(event) {

    console.error('ERRO MAPBOX:', event);

    if (
      event.error &&
      event.error.message
    ) {

      setStatus(
        'Erro Mapbox: ' +
        event.error.message
      );

    } else {

      setStatus('Erro ao carregar o mapa');

    }

  });


  // =====================================================
  // CONTROLES
  // =====================================================

  map.addControl(
    new mapboxgl.NavigationControl(),
    'top-right'
  );


  // =====================================================
  // GPS MAPBOX
  // =====================================================

  const geolocate =
    new mapboxgl.GeolocateControl({

      positionOptions: {

        enableHighAccuracy: true,

        timeout: 15000,

        maximumAge: 0

      },

      trackUserLocation: true,

      showUserLocation: true,

      showUserHeading: true,

      showAccuracyCircle: true

    });


  map.addControl(
    geolocate,
    'top-right'
  );


  // =====================================================
  // GPS ENCONTROU POSIÇÃO
  // =====================================================

  geolocate.on(
    'geolocate',
    function(event) {

      const lat =
        event.coords.latitude;

      const lng =
        event.coords.longitude;

      const accuracy =
        event.coords.accuracy;


      document.getElementById(
        'gpsInfo'
      ).style.display = 'block';


      document.getElementById(
        'gpsInfo'
      ).textContent =

        '📍 Lat: ' +
        lat.toFixed(6) +

        ' | Lng: ' +
        lng.toFixed(6) +

        ' | Precisão: ' +
        Math.round(accuracy) +
        ' m';


      setStatus('GPS funcionando');

    }
  );


  // =====================================================
  // GPS INICIANDO
  // =====================================================

  geolocate.on(
    'trackuserlocationstart',
    function() {

      setStatus(
        'Procurando sua localização...'
      );

    }
  );


  // =====================================================
  // ERRO GPS
  // =====================================================

  geolocate.on(
    'error',
    function(event) {

      console.error(
        'ERRO GPS:',
        event
      );

      setStatus(
        'Permita o acesso à localização'
      );

    }
  );


  // =====================================================
  // BOTÃO GPS
  // =====================================================

  document
    .getElementById('gps')
    .addEventListener(
      'click',
      function() {

        geolocate.trigger();

      }
    );


  // =====================================================
  // BUSCA
  // =====================================================

  const searchInput =
    document.getElementById(
      'searchInput'
    );

  const results =
    document.getElementById(
      'results'
    );


  let searchTimeout;


  searchInput.addEventListener(
    'input',
    function() {

      const query =
        searchInput.value.trim();


      clearTimeout(searchTimeout);


      if (query.length < 3) {

        results.innerHTML = '';

        return;

      }


      searchTimeout =
        setTimeout(
          function() {

            search(query);

          },
          400
        );

    }
  );


  // =====================================================
  // PESQUISA MAPBOX
  // =====================================================

  async function search(query) {

    results.innerHTML =
      '<div class="result">Pesquisando...</div>';


    try {

      const url =
        'https://api.mapbox.com/search/geocode/v6/forward' +

        '?q=' +
        encodeURIComponent(query) +

        '&limit=5' +

        '&language=pt-BR' +

        '&country=BR' +

        '&access_token=' +
        encodeURIComponent(MAPBOX_TOKEN);


      const response =
        await fetch(url);


      const data =
        await response.json();


      if (!response.ok) {

        console.error(
          'ERRO BUSCA:',
          data
        );

        results.innerHTML =
          '<div class="result">Erro na busca.</div>';

        return;

      }


      results.innerHTML = '';


      if (
        !data.features ||
        data.features.length === 0
      ) {

        results.innerHTML =
          '<div class="result">Nenhum local encontrado.</div>';

        return;

      }


      data.features.forEach(
        function(feature) {

          const item =
            document.createElement(
              'div'
            );


          item.className =
            'result';


          item.textContent =
            feature.properties.full_address ||
            feature.properties.name ||
            'Local';


          item.onclick =
            function() {

              selectPlace(feature);

            };


          results.appendChild(item);

        }
      );

    } catch (error) {

      console.error(
        'ERRO BUSCA:',
        error
      );

      results.innerHTML =
        '<div class="result">Erro de conexão.</div>';

    }

  }


  // =====================================================
  // SELECIONAR LOCAL
  // =====================================================

  let destinationMarker = null;


  function selectPlace(feature) {

    const coordinates =
      feature.geometry.coordinates;


    const lng =
      coordinates[0];

    const lat =
      coordinates[1];


    if (destinationMarker) {

      destinationMarker.remove();

    }


    destinationMarker =
      new mapboxgl.Marker({
        color: '#e53935'
      })
      .setLngLat([
        lng,
        lat
      ])
      .addTo(map);


    map.flyTo({

      center: [
        lng,
        lat
      ],

      zoom: 16,

      duration: 1000

    });


    searchInput.value =
      feature.properties.name ||
      feature.properties.full_address ||
      'Destino';


    results.innerHTML = '';


    setStatus(
      'Destino selecionado'
    );

  }


  // =====================================================
  // LIMPAR RESULTADOS
  // =====================================================

  document.addEventListener(
    'click',
    function(event) {

      const searchBox =
        document.getElementById(
          'search'
        );


      if (
        !searchBox.contains(
          event.target
        )
      ) {

        results.innerHTML = '';

      }

    }
  );

</script>

</body>
</html>
